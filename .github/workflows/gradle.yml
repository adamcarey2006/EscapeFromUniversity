

name: continuous integration

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v4
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    - name: Set up JDK 8
      uses: actions/setup-java@v4
      with:
        java-version: '8'
        distribution: 'temurin'


    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

    - name: Build with Gradle Wrapper
      run: ./gradlew build jacocoTestReport

  
    - name: Uploading JaCoCo coverage report
      uses: actions/upload-artifact@v6.0.0
      with:

        name: report-jacoco
        path: EscapeFromUniversity/core/build/reports/jacoco/test/html/

    - name: Uploading JAR
      uses: actions/upload-artifact@v6.0.0
      with:

        name: core-1.0.0.jar
        path: EscapeFromUniversity/core/build/libs/core-1.0.0.jar
